<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8fd0dc" />
    <meta
      name="description"
      content="One low poly city block: a corner restaurant with a rooftop terrace, vintage cars and a quiet street."
    />
    <title>Corner Block</title>
    <style>
      :root {
        --bg-top: #9ad7e2;
        --bg-bottom: #7fc4d4;
        --blush: #f4c9d2;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(120% 90% at 0% 100%, var(--blush) 0%, transparent 45%),
          linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      }
      #view {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div
      id="view"
      role="img"
      aria-label="A low poly city block: a corner restaurant with striped awnings and a rooftop terrace, vintage cars and figures on the street."
    ></div>
    <script type="module" src="/src/block/main.js"></script>
  </body>
</html>
